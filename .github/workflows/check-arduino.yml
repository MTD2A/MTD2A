name: Check Arduino

on:
  push:
  pull_request:
  schedule:
    # Run every Tuesday at 8 AM UTC to catch new lint rules
    - cron: "0 8 * * TUE"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v2
        with:
          compliance: specification
          library-manager: update
          # Always use this setting for official checks
          official: false
