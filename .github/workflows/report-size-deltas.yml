name: Report Size Deltas

on:
  workflow_dispatch:

permissions:
  actions: read          # to download the sketches-report artifacts
  pull-requests: write   # to post/update the PR comment

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Comment size deltas on PRs
        uses: arduino/report-size-deltas@v1
        with:
          # Regex matching the artifact names uploaded by compile-examples.yml
          sketches-reports-source: ^sketches-report-.+$
